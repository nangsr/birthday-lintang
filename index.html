<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Untuk Lintang Inka </title>

<link rel="stylesheet" href="style.css" />

<link href="https://fonts.googleapis.com/css?family=Poppins:wght@300;400;500; 600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css?family=Dancing+Script:wght@400;700&display swap" rel="stylesheet">

</head>

<body>

<!-- PART 1: HALAMAN AMPLOP-->

<section id="page-envelope" class="page active">

<!-- Background -->

<div class="bg">

<div class="cloud cloud1"></div>

<div class="cloud cloud2"></div>

<div class="cloud cloud3"></div>

<div class="stars"></div>

<div class="hearts-fall" id="heartsFall"></div>

</div>

<div class="content">

<h1 class="title">Untuk</h1>

<h1 class="name">Lintang Inka</h1>

<div class="divider"><i class="fas fa-heart"></i></div>

<p class="from">Dari</p>

<p class="from-name">Yutaro</p>

<div class="envelope-wrapper" id="envelopewrapper">

<div class="envelope" id="envelope">

<div class="envelope-flap"></div>

<div class="envelope-body">

<i class="fas fa-heart"></i>

</div>

</div>

</div>

</div>

<p class="hint">Klik amplop untuk membuka </p>

</section>

<!-- PART 2: HALAMAN ISI -->

<section id="page-content" class="page">

<!-- Tombol Kembali / Musik

<div class="top-bar">

<button id="musicBtn" class="music-btn">

<button id="backBtn" class="back-btn">

<i class="fas fa-arrow-left"></i> Kembali

</button>

</div>

<i class="fas fa-music"></i> <span>Play Music</span>

</button>

<!-- Slider Foto-->

<div class="slider" id="photoSlider">

<div class="slides">

<div class="slide active"><img src="images/foto1.jpg" alt="Foto 1"></div>

<div class="slide"><img src="images/foto2.jpg" alt="Foto 2"></div>

</div>

<div class="slide"><img src="images/foto3.jpg" alt="Foto 3"></div>

<button class="prev" id="prevBtn"><i class="fas fa-chevron-left"></i></button>

<button class="next" id="nextBtn"><i class="fas fa-chevron-right"></i></button>

<div class="dots" id="dots"></div>

</div>

<!-- Surat / Pesan -->

<div class="letter-container"s

<div class="paper">

<div class="heart-stamp"><i class="fas fa-heart"></i></div>

</div>

<div class="letter-content" id="typewriter"></div>

</div>

<!-- Akhir -->

<div class="final-message">

<h2>Happy 18th Birthday</h2>

<h1 class="final-name">Lintang Inka</h1>

<p class="love">Semoga hari-harimu selalu penuh kebahagiaan!</p>

</div>

<div class="heart-large"><i class="fas fa-heart"></i></div>

</section>

<!-- Musik -->

<audio id="bgMusic" loop preload="auto">

</audio>

<source src="music/i-wanna-be-yours.mp3" type="audio/mpeg">

<!-- Library Icons -->

<script src="https://kit.fontawesome.com/yourkitcode.js" crossorigin="anonymous"></script>

<!-- JavaScript -->

</html>

<script src="script.js"></script>

</body>
